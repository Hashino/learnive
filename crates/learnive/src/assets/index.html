<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Session token injected by the server; sent as the X-Learnive-Token
         header on every request, never in a cookie (§3.1). -->
    <meta name="learnive-token" content="{{TOKEN}}" />
    <!-- Empty inline favicon: avoids a GET /favicon.ico that the security layer
         rejects with 401 (§3.1) and that would clutter the console. -->
    <link rel="icon" href="data:," />
    <title>learnive</title>
    <!-- Style, theme boot and behaviour all live in separate files under
         `assets/` (still embedded in the binary, §15): the page was one 2k-line
         document and had become impossible to navigate. Each asset URL carries
         the session token in the query because the §3.1 guard authenticates
         every request, including these — a plain <link>/<script src> cannot set
         a header. -->
    <link rel="stylesheet" href="/assets/app.css?token={{TOKEN}}" />
    <!-- Localization layer (§3/§15): defines `t()`, `applyI18n()`, the locale
         switcher and the en/pt-BR dictionary. Loaded before every other
         script so `I18N_LANG` and the helpers already exist when they run. -->
    <script src="/assets/i18n.js?token={{TOKEN}}"></script>
    <!-- Set the theme before first paint (no flash): saved choice, else the OS
         preference. Not deferred, on purpose — it must run before the body
         renders. The toggle itself is wired in core.js. -->
    <script src="/assets/theme-init.js?token={{TOKEN}}"></script>
  </head>
  <body>
    <!-- Starfield (decorative, behind everything). -->
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <!-- Left sidebar (§S12): the document's name and its outline, revealed by
         reaching the left edge. Two panes — the outline, and the list of all
         living documents behind the ← button. There is no top bar: the theme
         toggle it held sits in this panel's footer, so the reading column
         gets the whole window and nothing permanent frames the text.
         Provider setup (§12) is reachable at /setup — deliberately not
         linked from here; it is a once-per-install page, not chrome. -->
    <aside id="sidebar" aria-label="Document navigation">
      <div class="sidebar-head">
        <button
          type="button"
          id="docsBackBtn"
          title="All documents"
          aria-label="All documents"
        >
          ←
        </button>
        <h2 id="docName" data-i18n-title="doc.rename" title="Click to rename"></h2>
      </div>

      <div id="outlinePane">
        <!-- No "Outline" label: a numbered list of concepts under the
             document's name is self-evident. The Documents pane keeps its
             label because it replaces this one in the same slot, and the
             two panes would otherwise be told apart only by their contents. -->
        <ol id="outline"></ol>
        <!-- §S5 revisit scheduler: a suggestion, not a mandate — hidden when
             nothing is currently skipped. -->
        <p id="revisitHint" class="muted" hidden></p>
      </div>

      <div id="docsPane" hidden>
        <p class="sidebar-section" data-i18n="docs.section">Documents</p>
        <ul id="docList"></ul>
        <button type="button" id="newDocBtn" data-i18n="doc.new">+ New document</button>
      </div>

      <!-- Footer: pushed to the bottom by the panes above it. The theme
            toggle and the language switcher — nothing else earns permanent
            space next to the document. -->
      <div class="sidebar-foot">
        <button
          id="themeToggle"
          class="icon-btn"
          type="button"
          data-i18n-aria="theme.toggle"
          data-i18n-title="theme.toggle"
          aria-label="Toggle light/dark theme"
          title="Toggle light/dark theme"
        ></button>
        <button
          id="langToggle"
          class="icon-btn"
          type="button"
          aria-label="Language"
          title="Language"
        >EN</button>
      </div>
    </aside>
    <!-- Invisible hover target along the left edge that reveals the sidebar. -->
    <div id="sidebarEdge"></div>

    <!-- Source viewer (§11): opens on a <cite> click, on the right — the same
         edge the future PDF split-view will occupy (§11.1). Read-only: no
         annotation lands here, only in the living document. -->
    <aside id="sourcePanel" data-i18n-aria="source.title" aria-label="Source">
      <div class="source-head">
        <div>
          <div id="sourceTitle"></div>
          <div id="sourceMeta" class="muted"></div>
        </div>
        <button type="button" id="sourceCloseBtn" data-i18n-aria="source.close" aria-label="Close">×</button>
      </div>
      <div id="sourceBody"></div>
    </aside>

    <div class="main-container">
      <!-- Cold start (§6.1): a single generic question. The objective
           `propose_objective` derives is used internally (it anchors every
           future generation decision, §5) but is no longer shown for
           up-front editing — it stays revisable later, from within the
           document (§5 versioned revision), not gated here. -->
      <section id="coldstart" class="card">
        <h1 data-i18n="coldstart.title">What are we learning?</h1>
        <form id="startForm">
          <textarea id="topic" rows="3" autofocus></textarea>
          <p><button type="submit" data-i18n="start.button">Start</button></p>
        </form>

        <!-- §S15: prerequisite tree confirmation — only shown when
             `propose_prerequisites` returned a non-empty tree. When it
             comes back empty (the common case for a simple, self-contained
             request) this is skipped entirely and generation starts
             directly. Every branch is podable in one click (skip/review
             cascade), which is the real backstop against a runaway
             curriculum, not the proposal prompt alone. -->
        <div id="prereqConfirm" hidden>
          <h2 data-i18n="prereq.title">Before we start</h2>
          <p class="muted" data-i18n="prereq.hint">
            These look like prerequisites for what you asked. Mark what you
            already know as review or skip — everything else is taught in
            full.
          </p>
          <ul id="prereqTree" class="prereq-tree"></ul>
          <p>
            <button type="button" id="prereqConfirmBtn" data-i18n="prereq.confirm">Confirm</button>
            <button type="button" id="prereqBackBtn" data-i18n="coldstart.back">Back</button>
          </p>
        </div>

        <p id="startStatus" class="muted"></p>
      </section>

      <!-- Living document (§9): a continuous scroll across every node
           visited or generated so far, not a single node swapped in and
           out. Each node owns one `.node-section` (built by
           `buildSection` in node.js) holding its own prose/exercise/
           interaction-layer/controls; sections are kept in outline order
           regardless of the order they were loaded in
           (`insertSectionInOrder`), and — on a large document — only the
           current node's neighborhood is fetched up front, with more
           loaded lazily as the reader nears either edge
           (`armEdgeLoading`/`maybeLoadNeighbor` in outline.js). -->
      <main id="doc" hidden class="card">
        <div id="nodeSections"></div>
        <!-- §9 margin annotations: post-its positioned beside their
             paragraph, outside the card (reading.js). Sits alongside
             `#nodeSections` rather than inside it so replacing a section's
             prose HTML on reload/regen never wipes it out. -->
        <div id="annotationsLayer"></div>

        <!-- A `plan` move's proposed outline revision, awaiting approval
             (§5 propose→approve, §S4). Pauses generation until decided.
             Lives outside `#nodeSections` (never cleared by a section
             remount) — it only ever appears right after the last section,
             since a `plan` move can only fire on the frontier node
             currently being generated, which is always the last one. -->
        <div id="planProposal" hidden class="card">
          <h2 data-i18n="plan.title">Proposed outline change</h2>
          <div id="planRationale"></div>
          <ol id="planProposedOutline"></ol>
          <p>
            <button type="button" id="planApproveBtn" data-i18n="plan.approve">Approve</button>
            <button type="button" id="planRejectBtn" data-i18n="plan.reject">Reject</button>
          </p>
        </div>
      </main>
    </div>

    <!-- §S6/§9 ask bar: one textbox anchored to the bottom of the window.
         It appears when text is selected in the document or when the pointer
         reaches the bottom edge, and its question is always anchored — to the
         selection if there is one, otherwise to the block on the reading line
         (§4.3). Outside `.main-container` so `position: fixed` resolves
         against the viewport (see the CSS note). -->
    <form id="askBar">
      <div id="askBarInner">
        <div id="askContext"></div>
        <div class="ask-row">
          <textarea
            id="askInput"
            rows="1"
            data-i18n-placeholder="ask.placeholder"
            data-i18n-aria="ask.aria"
            placeholder="Ask about what you're reading…"
            aria-label="Ask about what you're reading"
          ></textarea>
          <button type="submit" id="askSend" data-i18n="ask.send">Send</button>
        </div>
        <p id="askStatus" class="muted"></p>
      </div>
    </form>

    <!-- Load order is load-bearing: core.js first (token, state, helpers),
         node.js last (it calls boot()). Classic scripts, not ES modules —
         module sub-imports would be fetched without the ?token query and the
         guard would 401 them. -->
    <script src="/assets/core.js?token={{TOKEN}}"></script>
    <script src="/assets/documents.js?token={{TOKEN}}"></script>
    <script src="/assets/outline.js?token={{TOKEN}}"></script>
    <script src="/assets/reading.js?token={{TOKEN}}"></script>
    <script src="/assets/node.js?token={{TOKEN}}"></script>
  </body>
</html>
