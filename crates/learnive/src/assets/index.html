<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Session token injected by the server; sent as the X-Learnive-Token
         header on every request, never in a cookie (§3.1). -->
    <meta name="learnive-token" content="{{TOKEN}}" />
    <!-- Empty inline favicon: avoids a GET /favicon.ico that the security layer
         rejects with 401 (§3.1) and that would clutter the console. -->
    <link rel="icon" href="data:," />
    <title>learnive</title>
    <!-- Style from the author's blog (https://hashino.github.io): Nord palette,
         monospace font, translucent blurred cards and a starfield. Fonts are
         local (no external @import) to respect the §3.1 CSP and §15 offline
         portability; the starfield uses SVG in a data: URI (covered by
         img-src data:). -->
    <style>
      :root {
        /* Nord palette (fixed). The Polar Night (0-3) and Snow Storm (4-6)
           halves swap roles between the dark and light themes below. */
        --nord0: #2e3440;
        --nord1: #3b4252;
        --nord2: #434c5e;
        --nord3: #4c566a;
        --nord4: #d8dee9;
        --nord5: #e5e9f0;
        --nord6: #eceff4;
        --nord7: #8fbcbb;
        --nord8: #88c0d0;
        --nord9: #81a1c1;
        --nord10: #5e81ac;
        --nord11: #bf616a;
        --nord13: #ebcb8b;
        --nord14: #a3be8c;
        --roundness: 3px;
        --mono: "Ubuntu Mono", "JetBrains Mono", "Fira Code", Consolas,
          "Liberation Mono", Menlo, Courier, monospace;
      }

      /* Dark theme (default): semantic role tokens. The rules below only ever
         reference these, so switching themes = swapping this token block. */
      :root,
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: linear-gradient(
          135deg,
          var(--nord0) 0%,
          var(--nord1) 50%,
          var(--nord2) 100%
        );
        --fg: var(--nord4);
        --heading: var(--nord6);
        --heading-2: var(--nord5);
        --nav-bg: rgba(46, 52, 64, 0.95);
        --card-bg: rgba(59, 66, 82, 0.6);
        --card-border: var(--nord3);
        --card-shadow: rgba(46, 52, 64, 0.4);
        --link: var(--nord8);
        --link-hover: var(--nord7);
        --muted: var(--nord9);
        --accent: var(--nord8);
        --code-bg: var(--nord1);
        --code-fg: var(--nord13);
        --pre-bg: var(--nord0);
        --field-bg: rgba(76, 86, 106, 0.6);
        --field-fg: var(--nord6);
        --btn-bg: var(--nord10);
        --btn-hover: var(--nord9);
        --btn-fg: var(--nord6);
        --star-filter: none;
        --star-opacity: 1;
      }

      /* Light theme: Snow Storm backgrounds, Polar Night text, darker accents
         for contrast. */
      html[data-theme="light"] {
        color-scheme: light;
        --bg: linear-gradient(
          135deg,
          var(--nord6) 0%,
          var(--nord5) 50%,
          var(--nord4) 100%
        );
        --fg: var(--nord1);
        --heading: var(--nord0);
        --heading-2: var(--nord1);
        --nav-bg: rgba(236, 239, 244, 0.9);
        --card-bg: rgba(255, 255, 255, 0.72);
        --card-border: var(--nord4);
        --card-shadow: rgba(76, 86, 106, 0.15);
        --link: var(--nord10);
        --link-hover: var(--nord9);
        --muted: var(--nord3);
        --accent: var(--nord10);
        --code-bg: var(--nord5);
        --code-fg: var(--nord10);
        --pre-bg: var(--nord5);
        --field-bg: rgba(255, 255, 255, 0.85);
        --field-fg: var(--nord0);
        --btn-bg: var(--nord10);
        --btn-hover: var(--nord9);
        --btn-fg: var(--nord6);
        --star-filter: invert(1);
        --star-opacity: 0.35;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--mono);
        line-height: 1.5;
        color: var(--fg);
        background: var(--bg);
        background-attachment: fixed;
      }

      /* Animated starfield (the blog's signature). Inverted + dimmed in light. */
      #stars,
      #stars2,
      #stars3 {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        opacity: var(--star-opacity);
        filter: var(--star-filter);
      }
      #stars {
        background: transparent
          url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><circle cx="75" cy="75" r="1" fill="white" opacity="0.8"/><circle cx="150" cy="30" r="1" fill="white" opacity="0.6"/><circle cx="225" cy="180" r="1" fill="white" opacity="0.9"/><circle cx="50" cy="200" r="1" fill="white" opacity="0.7"/><circle cx="280" cy="120" r="1" fill="white" opacity="0.5"/></svg>')
          repeat;
        animation: moveStars 15s linear infinite;
      }
      #stars2 {
        background: transparent
          url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><circle cx="100" cy="50" r="0.8" fill="white" opacity="0.4"/><circle cx="40" cy="120" r="0.8" fill="white" opacity="0.6"/><circle cx="160" cy="170" r="0.8" fill="white" opacity="0.3"/></svg>')
          repeat;
        animation: moveStars 45s linear infinite;
      }
      #stars3 {
        background: transparent
          url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250"><circle cx="200" cy="100" r="0.6" fill="white" opacity="0.8"/><circle cx="80" cy="200" r="0.6" fill="white" opacity="0.4"/><circle cx="20" cy="50" r="0.6" fill="white" opacity="0.7"/></svg>')
          repeat;
        animation: moveStars 90s linear infinite;
      }
      @keyframes moveStars {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-300px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #stars,
        #stars2,
        #stars3 {
          animation: none;
        }
      }

      /* Fixed navigation bar. */
      .top-nav {
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
        padding: 0.6rem 0;
        background: var(--nav-bg);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--card-border);
      }
      .nav-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .nav-title {
        color: var(--heading);
        text-decoration: none;
        font-weight: 700;
        font-size: 1.2rem;
      }
      .nav-title:hover {
        color: var(--link);
      }
      .nav-tag {
        color: var(--muted);
        font-size: 0.9rem;
      }
      /* Ghost button so the toggle sits quietly in the nav. */
      .theme-toggle {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--card-border);
        padding: 0.3rem 0.55rem;
        font-size: 1rem;
        line-height: 1;
      }
      .theme-toggle:hover:not(:disabled) {
        background: transparent;
        color: var(--accent);
        border-color: var(--accent);
      }

      /* Central content column. */
      .main-container {
        max-width: 760px;
        margin: 0 auto;
        padding: 100px 2rem 3rem;
      }

      /* Translucent card (.blog-content style). */
      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--roundness);
        box-shadow: 0 10px 40px var(--card-shadow);
        backdrop-filter: blur(10px);
        padding: 2rem 2.5rem 2.5rem;
      }
      .card + .card {
        margin-top: 1.5rem;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--heading);
        margin: 0 0 1rem;
      }
      h2 {
        color: var(--heading-2);
        margin: 1.5rem 0 0.8rem;
      }
      h3 {
        color: var(--heading-2);
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        color: var(--link-hover);
        text-decoration: underline;
      }
      code {
        background: var(--code-bg);
        color: var(--code-fg);
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        font-size: 0.9em;
      }
      pre {
        background: var(--pre-bg);
        border-radius: var(--roundness);
        padding: 0.75rem 1rem;
        overflow-x: auto;
      }
      pre code {
        background: none;
        color: var(--fg);
        padding: 0;
      }
      blockquote {
        border-left: 4px solid var(--accent);
        margin: 1rem 0;
        padding-left: 1rem;
        font-style: italic;
        opacity: 0.9;
      }

      textarea {
        width: 100%;
        font: inherit;
        padding: 0.6rem;
        color: var(--field-fg);
        background: var(--field-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--roundness);
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .rem-answer {
        margin-top: 0.8rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        cursor: pointer;
        color: var(--btn-fg);
        background: var(--btn-bg);
        border: 1px solid var(--btn-bg);
        border-radius: var(--roundness);
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      button:hover:not(:disabled) {
        background: var(--btn-hover);
        border-color: var(--btn-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #outline {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0 0 1.5rem;
        padding-left: 1.2rem;
      }
      #outline li.current {
        font-weight: 700;
        color: var(--accent);
      }
      /* §S5 gate state: locked items are visible (so the graph shape reads)
         but not reachable; available/demonstrated items are clickable. */
      #outline li.state-locked {
        opacity: 0.5;
      }
      #outline li.state-available,
      #outline li.state-demonstrated {
        cursor: pointer;
      }
      #outline li.state-available:hover,
      #outline li.state-demonstrated:hover {
        color: var(--accent);
      }
      #prose {
        min-height: 2rem;
      }
      /* A spawned sub-node (§S8), spliced permanently into the reading flow
         right after the paragraph that prompted it — not a toggle, always
         rendered. The left border marks it as a distinct section without
         hiding it behind an expand/collapse affordance. */
      .subnode {
        border-left: 3px solid var(--accent);
        padding-left: 0.9rem;
        margin: 1rem 0;
      }
      .subnode > .subnode-title {
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-bottom: 0.4rem;
      }
      .subnode > .subnode-question {
        font-size: 0.9rem;
        font-style: italic;
        color: var(--muted);
        margin-bottom: 0.6rem;
      }
      figure[data-interactive] {
        margin: 1rem 0;
      }
      iframe.sandbox {
        display: block;
        width: 100%;
        border: 1px solid var(--card-border);
        border-radius: var(--roundness);
        /* Height is set by JS from the iframe's reported content height (no
           internal scroll). Small min just covers the brief pre-measure moment. */
        min-height: 2.5rem;
        background: var(--field-bg);
      }
      .grade {
        border-left: 3px solid var(--card-border);
        padding-left: 0.75rem;
        margin: 0.5rem 0;
      }
      .grade.demonstrated {
        border-color: var(--nord14);
      }
      .grade.partial {
        border-color: var(--nord13);
      }
      .grade.not_demonstrated {
        border-color: var(--nord11);
      }
      .muted {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .error {
        color: var(--nord11);
      }
      /* §S6 reading interactions (§9): the append-only Q&A/annotation/
         remediation history, each visually distinct so the source of a
         given entry (asked, noted, or a failed-check walkthrough) reads at
         a glance. */
      #interactions > div {
        border-left: 3px solid var(--card-border);
        padding-left: 0.75rem;
        margin: 0.75rem 0;
      }
      #interactions > .qa {
        border-color: var(--accent);
      }
      #interactions > .annotation {
        border-color: var(--nord13);
      }
      .reading-toolbar button {
        font-size: 0.85rem;
        padding: 0.3rem 0.6rem;
      }
      .reading-popover {
        position: fixed;
        z-index: 20;
        padding: 0.35rem;
        display: flex;
        gap: 0.35rem;
      }
      .reading-popover button {
        font-size: 0.8rem;
        padding: 0.25rem 0.5rem;
      }
      #readingForm textarea {
        width: 100%;
      }
    </style>
    <!-- Set the theme before first paint (no flash): saved choice, else the OS
         preference. The toggle is wired in the main script below. -->
    <script>
      (function () {
        var t = localStorage.getItem("learnive-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <!-- Starfield (decorative, behind everything). -->
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <nav class="top-nav">
      <div class="nav-container">
        <a href="/" class="nav-title">learnive</a>
        <div class="nav-right">
          <span class="nav-tag">living document</span>
          <a href="/setup" class="nav-tag" style="text-decoration: none">setup</a>
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle light/dark theme"
            title="Toggle light/dark theme"
          ></button>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <!-- Cold start (§6.1): a single generic question, then a confirmable
           objective (§S4) before the outline is generated. -->
      <section id="coldstart" class="card">
        <h1>What are we learning?</h1>
        <form id="startForm">
          <textarea id="topic" rows="3" autofocus></textarea>
          <p><button type="submit">Start</button></p>
        </form>

        <!-- Objective confirm (§6.1/§S4): the app almost never skips this —
             it anchors every future generation decision, so it's always
             shown editable, even for an unambiguous request. -->
        <div id="objectiveConfirm" hidden>
          <h2>Curriculum objective</h2>
          <p class="muted">
            Here's the objective we'll build the curriculum toward — edit it
            if this isn't quite right.
          </p>
          <textarea id="objectiveText" rows="2"></textarea>
          <p class="muted">Non-goals (comma-separated, optional):</p>
          <textarea id="nonGoalsText" rows="1"></textarea>
          <p>
            <button type="button" id="objectiveConfirmBtn">Confirm</button>
            <button type="button" id="objectiveBackBtn">Back</button>
          </p>
        </div>

        <p id="startStatus" class="muted"></p>
      </section>

      <!-- Living document (§9). -->
      <main id="doc" hidden class="card">
        <ol id="outline"></ol>
        <!-- §S5 revisit scheduler: a suggestion, not a mandate — hidden when
             nothing is currently skipped. -->
        <p id="revisitHint" class="muted" hidden></p>

        <!-- §S6 reading interactions (§9 "the document is the answer"):
             question-on-the-line / a note anchored to whichever block is
             nearest the viewport center — the reading line's position, read
             once at click time, never persisted (§9); only the resulting
             anchor is. Disabled until the node is finalized. -->
        <p class="reading-toolbar">
          <button type="button" id="askLineBtn" disabled>Ask about this</button>
          <button type="button" id="noteLineBtn" disabled>Add a note</button>
        </p>

        <article id="prose"></article>
        <div id="exercise"></div>
        <!-- Scroll-to-end sentinel (§S6 "Ritmo"): crossing this logs the
             signal event. Placed after the exercise so it marks the end of
             the node's actual content, not the interaction history below. -->
        <div id="readEndSentinel"></div>
        <!-- Append-only interaction layer (§4.3): attempts + remediation
             accumulate here and are never overwritten within a node. -->
        <div id="interactions"></div>
        <!-- Transient status only (evaluating…, errors). -->
        <div id="result"></div>
        <div id="controls"></div>

        <!-- Floating popover shown next to a live text selection inside
             #prose (§S6 selection→question/annotation). -->
        <div id="selectionPopover" class="card reading-popover" hidden>
          <button type="button" id="selAskBtn">Ask</button>
          <button type="button" id="selNoteBtn">Note</button>
        </div>

        <!-- Shared inline form for both "ask" and "annotate" (§S6) — which
             one is filled in by whichever control opened it. -->
        <form id="readingForm" class="card" hidden>
          <h3 id="readingFormTitle"></h3>
          <textarea id="readingFormText" rows="2"></textarea>
          <p>
            <button type="submit">Send</button>
            <button type="button" id="readingFormCancel">Cancel</button>
          </p>
          <p id="readingFormStatus" class="muted"></p>
        </form>

        <!-- A `plan` move's proposed outline revision, awaiting approval
             (§5 propose→approve, §S4). Pauses generation until decided. -->
        <div id="planProposal" hidden class="card">
          <h2>Proposed outline change</h2>
          <div id="planRationale"></div>
          <ol id="planProposedOutline"></ol>
          <p>
            <button type="button" id="planApproveBtn">Approve</button>
            <button type="button" id="planRejectBtn">Reject</button>
          </p>
        </div>
      </main>
    </div>

    <script>
      const TOKEN = document.querySelector('meta[name="learnive-token"]').content;

      // Every request carries the token in the header (§3.1).
      function api(path, options = {}) {
        const headers = Object.assign(
          { "X-Learnive-Token": TOKEN },
          options.headers || {},
        );
        return fetch(path, Object.assign({}, options, { headers }));
      }
      function postJson(path, body) {
        return api(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      }

      const el = (id) => document.getElementById(id);
      // items: [{id, title, state}] from the server (§S5) — state is
      // "locked" | "available" | "demonstrated", the graph's gate resolved.
      // currentId is the outline item id being generated/answered; nodeId
      // mirrors it once generation actually completes (kept separate so a
      // still-streaming request doesn't let a stray postMessage answer
      // reach the wrong node).
      const state = {
        docId: null,
        items: [],
        currentId: null,
        nodeId: null,
        suggestedRevisit: null,
      };
      // The current exercise's sandbox iframe (for height + theme messages).
      let exerciseFrame = null;

      // --- Theme toggle -----------------------------------------------------
      // The head script already applied the theme; here we wire the switch and
      // persist the choice. The icon shows the mode you'd switch TO.
      const currentTheme = () =>
        document.documentElement.dataset.theme === "light" ? "light" : "dark";
      function syncThemeToggle() {
        el("themeToggle").textContent = currentTheme() === "light" ? "☾" : "☀";
      }
      el("themeToggle").addEventListener("click", () => {
        const next = currentTheme() === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("learnive-theme", next);
        syncThemeToggle();
        // Re-theme every sandbox iframe (node check + remediation problems);
        // they're reachable only by message (§4.4).
        for (const f of document.querySelectorAll("iframe.sandbox")) {
          if (f.contentWindow) {
            f.contentWindow.postMessage(
              { type: "learnive-theme", theme: next },
              "*",
            );
          }
        }
      });
      syncThemeToggle();

      // --- Cold start (§6.1/§S4) ---------------------------------------------
      // Two steps: propose a compact, editable objective from the raw topic,
      // then confirm (possibly edited) before the outline is generated and
      // the document is created — the objective anchors every later move.
      let pendingTopic = null;

      el("startForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const topic = el("topic").value.trim();
        if (!topic) return;
        pendingTopic = topic;
        el("startStatus").textContent = "thinking about the objective…";
        try {
          const resp = await postJson("/api/objective/propose", { topic });
          if (!resp.ok) throw new Error(await resp.text());
          const data = await resp.json();
          el("objectiveText").value = data.text;
          el("nonGoalsText").value = (data.non_goals || []).join(", ");
          el("startStatus").textContent = "";
          el("startForm").hidden = true;
          el("objectiveConfirm").hidden = false;
        } catch (err) {
          el("startStatus").innerHTML =
            '<span class="error">failed: ' + escapeHtml(String(err)) + "</span>";
        }
      });

      el("objectiveBackBtn").addEventListener("click", () => {
        el("objectiveConfirm").hidden = true;
        el("startForm").hidden = false;
      });

      el("objectiveConfirmBtn").addEventListener("click", async () => {
        const objective_text = el("objectiveText").value.trim();
        const non_goals = el("nonGoalsText")
          .value.split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        el("startStatus").textContent = "planning the curriculum…";
        try {
          const resp = await postJson("/api/documents", {
            topic: pendingTopic,
            objective_text,
            non_goals,
          });
          if (!resp.ok) throw new Error(await resp.text());
          const data = await resp.json();
          state.docId = data.doc_id;
          state.items = data.items;
          el("coldstart").hidden = true;
          el("doc").hidden = false;
          renderOutline();
          generateNode(state.items[0].id);
        } catch (err) {
          el("startStatus").innerHTML =
            '<span class="error">failed: ' + escapeHtml(String(err)) + "</span>";
        }
      });

      // Renders the outline with its gate state (§S5): locked items are
      // shown but not clickable, available/demonstrated items jump straight
      // to that node (not just "next" — a diamond can leave several
      // available at once, even though today's outlines are all linear).
      function renderOutline() {
        el("outline").innerHTML = state.items
          .map((it) => {
            const cls = [
              it.id === state.currentId ? "current" : "",
              "state-" + it.state,
            ]
              .filter(Boolean)
              .join(" ");
            const badge =
              it.state === "locked" ? " 🔒" : it.state === "demonstrated" ? " ✓" : "";
            return (
              '<li class="' +
              cls +
              '" data-id="' +
              it.id +
              '">' +
              escapeHtml(it.title) +
              badge +
              "</li>"
            );
          })
          .join("");
        el("outline")
          .querySelectorAll("li[data-id]")
          .forEach((li) => {
            const it = state.items.find((i) => i.id === li.dataset.id);
            if (it && it.state !== "locked") {
              li.addEventListener("click", () => openNode(it.id));
            }
          });
      }

      // §S5 revisit scheduler: shows the server's suggestion (the
      // longest-deferred skipped node), clickable, or hides the hint when
      // there's nothing to suggest.
      function renderRevisitHint() {
        const hint = el("revisitHint");
        const target = state.items.find((it) => it.id === state.suggestedRevisit);
        if (!target) {
          hint.hidden = true;
          hint.onclick = null;
          return;
        }
        hint.hidden = false;
        hint.textContent = "↺ Consider revisiting: " + target.title;
        hint.style.cursor = "pointer";
        hint.onclick = () => openNode(target.id);
      }

      // Re-reads the outline's gate state from the server (§S5) — called
      // after anything that can change it (advancing, skipping).
      async function refreshOutline() {
        const resp = await api(`/api/documents/${state.docId}/outline`);
        if (resp.ok) {
          const data = await resp.json();
          state.items = data.items;
          state.suggestedRevisit = data.suggested_revisit || null;
          renderOutline();
          renderRevisitHint();
        }
      }

      // Opens an outline item non-destructively: an already-generated node
      // (skipped or demonstrated) is just READ (§S5/§4.3 — regenerating it
      // would clobber the append-only interaction layer); a never-generated
      // one falls through to the normal streaming generation path.
      async function openNode(id) {
        try {
          const resp = await api(`/api/documents/${state.docId}/nodes/${id}`);
          if (resp.status === 404) {
            return generateNode(id);
          }
          if (!resp.ok) throw new Error(await resp.text());
          await renderExistingNode(id, await resp.json());
        } catch (err) {
          el("controls").innerHTML =
            '<p class="error">could not open node: ' +
            escapeHtml(String(err)) +
            "</p>";
        }
      }

      // Renders an already-generated node read back from the server: frozen
      // prose, the append-only interaction history, and — if not yet
      // demonstrated — the still-active exercise, answerable exactly like a
      // freshly generated one.
      async function renderExistingNode(id, data) {
        state.currentId = id;
        state.nodeId = id;
        renderOutline();
        el("prose").innerHTML = sanitizeHtml(data.content_html);
        el("prose").dataset.nodeId = id;
        hydrateIslands(el("prose"), id);
        el("result").innerHTML = "";
        el("interactions").innerHTML = "";
        await hydrateInteractions(data.interactions, el("interactions"));
        if (data.has_exercise) {
          renderExercise(id);
          el("controls").innerHTML = "";
          renderSkipControl();
        } else {
          el("exercise").innerHTML = "";
          exerciseFrame = null;
          el("controls").innerHTML =
            '<p class="muted">Already demonstrated.</p>';
        }
        setReadingToolsEnabled(true);
        armReadToEndWatcher();
      }

      // Shows the "skip" control (§S5, "botão pular") only when there's
      // another reachable node to skip to — never for a linear doc's last
      // (or only) available item.
      function renderSkipControl() {
        const other = state.items.find(
          (it) => it.id !== state.currentId && it.state !== "locked",
        );
        if (!other) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Skip for now →";
        btn.addEventListener("click", skipCurrentNode);
        el("controls").appendChild(btn);
      }

      async function skipCurrentNode() {
        if (!state.currentId) return;
        const skippedId = state.currentId;
        try {
          const resp = await postJson(
            `/api/documents/${state.docId}/nodes/${skippedId}/skip`,
            {},
          );
          if (!resp.ok) throw new Error(await resp.text());
          const data = await resp.json();
          state.items = data.items;
          state.suggestedRevisit = data.suggested_revisit || null;
          renderOutline();
          renderRevisitHint();
          const next = state.items.find(
            (it) => it.id !== skippedId && it.state !== "locked",
          );
          if (next) {
            openNode(next.id);
          } else {
            el("controls").innerHTML =
              '<p class="muted">Nothing else available yet.</p>';
          }
        } catch (err) {
          el("result").innerHTML =
            '<span class="error">skip failed: ' +
            escapeHtml(String(err)) +
            "</span>";
        }
      }

      // --- §S6 reading interactions (§9 "the document is the answer") ------
      // Selection→question/annotation: a popover next to any text selected
      // inside #prose. Question-on-the-line / a note with no selection: the
      // toolbar buttons anchor to whichever block is nearest the viewport
      // center instead — the reading line's position, read once at click
      // time and never persisted (§9); only the resulting anchor is. Both
      // paths land in the shared inline form, which posts to `/ask` or
      // `/annotate` and appends the returned thread to the interaction
      // layer exactly like a page-load already does.

      function setReadingToolsEnabled(enabled) {
        el("askLineBtn").disabled = !enabled;
        el("noteLineBtn").disabled = !enabled;
      }

      // Returns `{blockId, nodeId}` for the block nearest the reading line,
      // or null. `nodeId` is whichever node actually owns that block — the
      // top-level node (`#prose` carries its own `data-node-id`) or a
      // spliced sub-node (§S8: each `.subnode` wrapper carries its own) —
      // never assumed to be `state.nodeId`, since a spliced sub-node's
      // blocks live inside `#prose` too.
      function currentReadingBlockId() {
        const blocks = el("prose").querySelectorAll("[data-block-id]");
        if (blocks.length === 0) return null;
        const center = window.innerHeight / 2;
        let best = blocks[0];
        let bestDist = Infinity;
        blocks.forEach((b) => {
          const rect = b.getBoundingClientRect();
          const dist = Math.abs((rect.top + rect.bottom) / 2 - center);
          if (dist < bestDist) {
            bestDist = dist;
            best = b;
          }
        });
        const owner = best.closest("[data-node-id]");
        return {
          blockId: best.dataset.blockId,
          nodeId: owner ? owner.dataset.nodeId : state.nodeId,
        };
      }

      // Builds a §4.3 Anchor from the live DOM Selection: the block id of
      // the closest ancestor inside #prose, plus an exact quote (with a
      // little surrounding context to disambiguate repeats) when text is
      // actually selected — the same contract `core::anchor` resolves
      // server-side. Also resolves which node owns that block (§S8: could
      // be a spliced sub-node, not always the top-level `state.nodeId`).
      function anchorFromSelection() {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
        const node = sel.getRangeAt(0).commonAncestorContainer;
        const el0 = node.nodeType === 1 ? node : node.parentElement;
        const block = el0 && el0.closest("[data-block-id]");
        if (!block || !el("prose").contains(block)) return null;
        const exact = sel.toString();
        if (!exact.trim()) return null;
        const text = block.textContent || "";
        const start = text.indexOf(exact);
        const quote = { exact };
        if (start >= 0) {
          const prefix = text.slice(Math.max(0, start - 20), start);
          const suffix = text.slice(start + exact.length, start + exact.length + 20);
          if (prefix) quote.prefix = prefix;
          if (suffix) quote.suffix = suffix;
        }
        const owner = block.closest("[data-node-id]");
        return {
          anchor: { block_id: block.dataset.blockId, quote },
          nodeId: owner ? owner.dataset.nodeId : state.nodeId,
        };
      }

      let selectionAnchor = null;
      let selectionAnchorNodeId = null;
      function hideSelectionPopover() {
        el("selectionPopover").hidden = true;
        selectionAnchor = null;
        selectionAnchorNodeId = null;
      }
      document.addEventListener("mouseup", (e) => {
        // A click on the popover's own buttons fires `mouseup` on them too,
        // before their `click` handler runs — without this guard, this
        // listener would hide the popover (clearing `selectionAnchor`)
        // first, so "Ask"/"Note" would silently do nothing.
        if (el("selectionPopover").contains(e.target)) return;
        if (!state.nodeId || !el("prose").contains(e.target)) {
          hideSelectionPopover();
          return;
        }
        const r = anchorFromSelection();
        if (!r) {
          hideSelectionPopover();
          return;
        }
        selectionAnchor = r.anchor;
        selectionAnchorNodeId = r.nodeId;
        const pop = el("selectionPopover");
        pop.style.left = e.clientX + "px";
        pop.style.top = Math.max(0, e.clientY - 40) + "px";
        pop.hidden = false;
      });
      el("selAskBtn").addEventListener("click", () => {
        if (selectionAnchor) openReadingForm("ask", selectionAnchor, selectionAnchorNodeId);
        hideSelectionPopover();
      });
      el("selNoteBtn").addEventListener("click", () => {
        if (selectionAnchor) openReadingForm("annotate", selectionAnchor, selectionAnchorNodeId);
        hideSelectionPopover();
      });

      el("askLineBtn").addEventListener("click", () => {
        const r = currentReadingBlockId();
        if (r) openReadingForm("ask", { block_id: r.blockId }, r.nodeId);
      });
      el("noteLineBtn").addEventListener("click", () => {
        const r = currentReadingBlockId();
        if (r) openReadingForm("annotate", { block_id: r.blockId }, r.nodeId);
      });

      let readingFormMode = null;
      let readingFormAnchor = null;
      let readingFormNodeId = null;
      function openReadingForm(mode, anchor, nodeId) {
        if (!state.nodeId) return;
        readingFormMode = mode;
        readingFormAnchor = anchor;
        readingFormNodeId = nodeId || state.nodeId;
        el("readingFormTitle").textContent =
          mode === "ask" ? "Ask about this" : "Add a note";
        el("readingFormText").value = "";
        el("readingFormStatus").textContent = "";
        el("readingForm").hidden = false;
        el("readingFormText").focus();
      }
      function closeReadingForm() {
        el("readingForm").hidden = true;
        readingFormMode = null;
        readingFormAnchor = null;
        readingFormNodeId = null;
      }
      el("readingFormCancel").addEventListener("click", closeReadingForm);
      el("readingForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = el("readingFormText").value.trim();
        if (!text || !readingFormAnchor || !readingFormNodeId) return;
        const mode = readingFormMode;
        const targetNodeId = readingFormNodeId;
        const anchor = readingFormAnchor;
        el("readingFormStatus").textContent =
          mode === "ask" ? "thinking…" : "saving…";
        try {
          const path =
            mode === "ask"
              ? `/api/documents/${state.docId}/nodes/${targetNodeId}/ask`
              : `/api/documents/${state.docId}/nodes/${targetNodeId}/annotate`;
          const payload =
            mode === "ask" ? { question: text, anchor } : { body: text, anchor };
          const resp = await postJson(path, payload);
          if (!resp.ok) throw new Error(await resp.text());
          const data = await resp.json();
          if (mode === "ask" && data.kind === "spawn") {
            // §S8: not a toggle — permanently spliced right after the
            // paragraph where the question was asked.
            const anchorEl = document.querySelector(
              '[data-block-id="' + anchor.block_id + '"]',
            );
            if (anchorEl) {
              const sub = buildSubNodeWrapper(
                data.node_id,
                data.title,
                '<strong>You asked:</strong> ' + escapeHtml(text),
              );
              sub.proseEl.innerHTML = sanitizeHtml(data.content_html);
              hydrateIslands(sub.proseEl, data.node_id);
              anchorEl.insertAdjacentElement("afterend", sub.wrapper);
            }
          } else {
            const div = document.createElement("div");
            div.className = mode === "ask" ? "qa" : "annotation";
            div.innerHTML = sanitizeHtml(data.body_html);
            interactionsContainerFor(targetNodeId).appendChild(div);
          }
          closeReadingForm();
        } catch (err) {
          el("readingFormStatus").innerHTML =
            '<span class="error">' + escapeHtml(String(err)) + "</span>";
        }
      });

      // §S8: a spawned sub-node's DOM shell — its own prose container and
      // its own (initially empty) interaction container, so a question
      // asked *inside* a sub-node nests exactly the same way, recursively.
      function buildSubNodeWrapper(subNodeId, title, questionHtml) {
        const wrapper = document.createElement("div");
        wrapper.className = "subnode";
        wrapper.dataset.nodeId = subNodeId;
        const titleEl = document.createElement("div");
        titleEl.className = "subnode-title";
        titleEl.textContent = title || "";
        wrapper.appendChild(titleEl);
        // §7: the selection-plus-question that triggered this section is the
        // highest-signal input in the app — it must survive on the page, not
        // just live in the parent's interaction log where nothing renders it.
        if (questionHtml) {
          const qEl = document.createElement("div");
          qEl.className = "subnode-question";
          qEl.innerHTML = sanitizeHtml(questionHtml);
          wrapper.appendChild(qEl);
        }
        const proseEl = document.createElement("div");
        proseEl.className = "subnode-prose";
        const interEl = document.createElement("div");
        interEl.className = "subnode-interactions";
        wrapper.appendChild(proseEl);
        wrapper.appendChild(interEl);
        return { wrapper, proseEl, interEl };
      }

      // Pulls the "<p class="question">You asked: ...</p>" fragment out of a
      // parent-side spawn marker's `body_html` (§S8) so a reload can show the
      // same question text a live session showed — without re-parsing HTML
      // by hand.
      function extractQuestionHtml(markerBodyHtml) {
        const tmp = document.createElement("div");
        tmp.innerHTML = sanitizeHtml(markerBodyHtml || "");
        const q = tmp.querySelector(".question");
        return q ? q.innerHTML : "";
      }

      // The right interaction container for a node id: the top-level panel
      // for the currently open node, or a spliced sub-node's own container
      // (§S8) — never assumed to be `#interactions` just because that's
      // where every reply landed before this slice.
      function interactionsContainerFor(nodeId) {
        if (!nodeId || nodeId === state.nodeId) return el("interactions");
        const wrapper = document.querySelector('[data-node-id="' + nodeId + '"]');
        return (wrapper && wrapper.querySelector(".subnode-interactions")) || el("interactions");
      }

      // Fetches and permanently splices a sub-node (§S8) right after
      // `anchorBlockId`, then recursively hydrates ITS OWN interactions
      // (including further nested spawns) into its own containers — a
      // reload must reconstruct exactly what a live session already spliced.
      async function spliceSubNodeFromServer(anchorBlockId, subNodeId, questionHtml) {
        const anchorEl = document.querySelector(
          '[data-block-id="' + anchorBlockId + '"]',
        );
        if (!anchorEl) return;
        try {
          const resp = await api(
            `/api/documents/${state.docId}/nodes/${subNodeId}`,
          );
          if (!resp.ok) return;
          const data = await resp.json();
          const sub = buildSubNodeWrapper(subNodeId, data.title, questionHtml);
          sub.proseEl.innerHTML = sanitizeHtml(data.content_html);
          hydrateIslands(sub.proseEl, subNodeId);
          anchorEl.insertAdjacentElement("afterend", sub.wrapper);
          await hydrateInteractions(data.interactions, sub.interEl);
        } catch (err) {
          // Best-effort: a failed sub-node fetch just leaves that spot
          // unspliced rather than breaking the rest of the reload.
        }
      }

      // Renders a node's interaction layer into `interactionsEl`, except a
      // `qa` thread that spawned a sub-node (§S8) — that one is spliced
      // inline into the prose instead of listed here.
      async function hydrateInteractions(interactions, interactionsEl) {
        for (const item of interactions || []) {
          if (item.kind === "qa" && item.child_node_id) {
            await spliceSubNodeFromServer(
              item.anchor_block,
              item.child_node_id,
              extractQuestionHtml(item.body_html),
            );
            continue;
          }
          const div = document.createElement("div");
          div.className = item.kind;
          div.innerHTML = sanitizeHtml(item.body_html);
          interactionsEl.appendChild(div);
        }
      }

      // §S6 "Ritmo": crossing the sentinel after the exercise logs the
      // scroll-to-end signal once per node. A pure signal today — nothing
      // reacts to it yet (see the server's `EventKind::NodeReadToEnd` doc
      // comment for why gating the next move on it is a separate slice).
      let readEndFired = false;
      let readEndObserver = null;
      function armReadToEndWatcher() {
        readEndFired = false;
        if (readEndObserver) readEndObserver.disconnect();
        // IntersectionObserver fires once immediately with whatever the
        // current state already is — for a node short enough to fit the
        // viewport, that's an "intersecting" callback before the learner has
        // scrolled a pixel, which would log the signal before they've read
        // anything. Ignore that first callback; only a later transition
        // (an actual scroll bringing the sentinel into view) counts.
        let firstCallback = true;
        readEndObserver = new IntersectionObserver(
          (entries) => {
            const wasFirst = firstCallback;
            firstCallback = false;
            if (readEndFired || !state.nodeId || wasFirst) return;
            if (entries.some((e) => e.isIntersecting)) {
              readEndFired = true;
              postJson(
                `/api/documents/${state.docId}/nodes/${state.nodeId}/read-to-end`,
                {},
              ).catch(() => {});
            }
          },
          { threshold: 0.1 },
        );
        readEndObserver.observe(el("readEndSentinel"));
      }

      // --- Node generation with streaming (§6, §14) -------------------------
      async function generateNode(id) {
        state.currentId = id;
        state.nodeId = null;
        renderOutline();
        el("prose").innerHTML = "";
        el("exercise").innerHTML = "";
        exerciseFrame = null;
        el("interactions").innerHTML = "";
        el("result").innerHTML = "";
        el("controls").innerHTML = '<p class="muted">generating…</p>';
        setReadingToolsEnabled(false);
        hideSelectionPopover();
        closeReadingForm();

        let prose = "";
        try {
          const resp = await api(
            `/api/documents/${state.docId}/nodes/${id}/generate`,
            { method: "POST" },
          );
          if (!resp.ok) throw new Error(await resp.text());
          await readSse(resp, (event, data) => {
            if (event === "token") {
              // Re-rendering the accumulated text tolerates partial tags during
              // the stream. Sanitized: LLM-generated prose goes to the app
              // origin, so it must NOT carry script/handlers (§3.1/§4.4). Only
              // interactive blocks run — and only inside the sandbox iframe.
              prose += data;
              el("prose").innerHTML = sanitizeHtml(prose);
            } else if (event === "exercise") {
              renderExercise(data);
            } else if (event === "plan_proposal") {
              // A `plan` move proposed a structural outline change (§5) —
              // this generation request ends here, unfinished, awaiting the
              // learner's decision (nothing was persisted for this attempt).
              renderPlanProposal(JSON.parse(data));
            } else if (event === "done") {
              // Empty data means a plan_proposal paused this request instead
              // of finishing a node — renderPlanProposal already set up the
              // approve/reject controls, so leave them alone.
              if (data) {
                state.nodeId = data;
                el("prose").dataset.nodeId = data;
                el("controls").innerHTML = "";
                renderSkipControl();
                // The just-streamed prose has no data-block-id attributes —
                // those are assigned server-side at finalize (§4.3), which
                // only happens once the whole node, including the graded
                // move, is done. Reading tools anchor on those ids (§S6),
                // so swap in the finalized, block-tagged content now that
                // it exists. Fire-and-forget: nothing here depends on it,
                // and a failure just leaves the streamed prose in place.
                api(`/api/documents/${state.docId}/nodes/${data}`)
                  .then((resp) => (resp.ok ? resp.json() : null))
                  .then((view) => {
                    if (view) {
                      el("prose").innerHTML = sanitizeHtml(view.content_html);
                      hydrateIslands(el("prose"), data);
                    }
                  })
                  .catch(() => {});
                setReadingToolsEnabled(true);
                armReadToEndWatcher();
              }
            } else if (event === "error") {
              throw new Error(data);
            }
          });
        } catch (err) {
          el("controls").innerHTML =
            '<p class="error">generation error: ' +
            escapeHtml(String(err)) +
            "</p>";
        }
      }

      // Renders the generated exercise in a SANDBOX iframe (§3.1/§4.4): no
      // allow-same-origin, so the generated HTML never sees the token or the
      // parent DOM; it returns the answer only via postMessage.
      function renderExercise(nodeId) {
        const iframe = buildExerciseIframe(nodeId);
        el("exercise").replaceChildren(iframe);
        exerciseFrame = iframe;
      }

      // Shows a `plan` move's proposed outline revision (§5 propose→approve,
      // §S4). The rationale is sanitized prose (app origin, same contract as
      // the node's own prose); the proposed titles are plain text.
      function renderPlanProposal(proposal) {
        el("controls").innerHTML = "";
        el("planRationale").innerHTML = sanitizeHtml(proposal.html);
        el("planProposedOutline").innerHTML = proposal.proposed
          .map((t) => "<li>" + escapeHtml(t) + "</li>")
          .join("");
        el("planProposal").hidden = false;
      }

      el("planApproveBtn").addEventListener("click", () => decidePlanProposal(true));
      el("planRejectBtn").addEventListener("click", () => decidePlanProposal(false));

      // Either way the proposal is resolved and the interrupted generation
      // attempt (nothing was persisted for it) is retried from scratch.
      async function decidePlanProposal(approve) {
        el("planProposal").hidden = true;
        try {
          const resp = await postJson(
            `/api/documents/${state.docId}/plan/decide`,
            { approve },
          );
          if (!resp.ok) throw new Error(await resp.text());
          const data = await resp.json();
          state.items = data.items;
          renderOutline();
        } catch (err) {
          el("result").innerHTML =
            '<span class="error">plan decision failed: ' +
            escapeHtml(String(err)) +
            "</span>";
        }
        generateNode(state.currentId);
      }

      // Builds a sandboxed exercise iframe (used for the node's check AND for the
      // remediation loop's new practice problems, §8.2) — both are the same node
      // id's currently-active exercise (remediation overwrites the rubric sidecar
      // in place, §8.2), so both are just this one URL.
      //
      // A real `src=` fetch, not `srcdoc`: `srcdoc` documents inherit the parent
      // page's CSP, which would break once the app origin's CSP drops
      // `unsafe-inline` (planned hardening) — the frame endpoint
      // (`api::exercise_frame`) sets its own, separate CSP and builds the whole
      // harness (theme/height/answer-collection) server-side instead.
      // §S11: finds every still-empty interactive-island placeholder (§4.4)
      // inside `container` — an `ensure_block_ids`-tagged
      // `<figure data-interactive data-block-id>`, redacted server-side
      // (`redact_interactive_blocks`) so it never carries raw script — and
      // swaps it for its own sandboxed iframe, fetched from its own frame
      // endpoint. Same pattern as the exercise, just per content block
      // instead of per node. `:not([data-hydrated])` makes repeated calls
      // (e.g. every `renderExistingNode`) idempotent, never double-wrapping.
      function hydrateIslands(container, nodeId) {
        const islands = container.querySelectorAll(
          "[data-interactive][data-block-id]:not([data-hydrated])",
        );
        for (const el of islands) {
          el.dataset.hydrated = "1";
          const iframe = document.createElement("iframe");
          iframe.className = "sandbox island";
          iframe.title = "Interactive content";
          iframe.setAttribute("sandbox", "allow-scripts");
          const url = new URL(
            `/api/documents/${state.docId}/nodes/${nodeId}/blocks/${el.dataset.blockId}/frame`,
            location.origin,
          );
          url.searchParams.set("token", TOKEN);
          url.searchParams.set("theme", currentTheme());
          iframe.src = url.toString();
          el.replaceChildren(iframe);
        }
      }

      function buildExerciseIframe(nodeId) {
        const iframe = document.createElement("iframe");
        iframe.className = "sandbox";
        iframe.title = "Exercise";
        iframe.setAttribute("sandbox", "allow-scripts");
        const url = new URL(
          `/api/documents/${state.docId}/nodes/${nodeId}/exercise-frame`,
          location.origin,
        );
        url.searchParams.set("token", TOKEN);
        url.searchParams.set("theme", currentTheme());
        iframe.src = url.toString();
        return iframe;
      }

      // Messages from the sandbox iframe (§4.4): the answer artifact, and the
      // reported content height used to size the box to fit (no internal scroll).
      window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d) return;
        if (d.type === "learnive-answer") {
          submitAnswer(d.answer);
        } else if (d.type === "learnive-height" && typeof d.height === "number") {
          // Size whichever sandbox frame reported (node exercise or a remediation
          // practice problem) — match by its content window.
          for (const f of document.querySelectorAll("iframe.sandbox")) {
            if (f.contentWindow === e.source) {
              f.style.height = Math.max(d.height + 2, 40) + "px";
              break;
            }
          }
        }
      });

      // --- Answer → grading → remediation/advance (§8, §8.2) ----------------
      async function submitAnswer(answer) {
        if (!state.nodeId) return;
        // Transient status only — never wipes the interaction log below.
        el("result").innerHTML = '<p class="muted">evaluating…</p>';
        try {
          const resp = await postJson(
            `/api/documents/${state.docId}/nodes/${state.nodeId}/answer`,
            { answer },
          );
          if (!resp.ok) throw new Error(await resp.text());
          const data = await resp.json();
          el("result").innerHTML = "";
          appendGrades(data.grades);
          if (data.advance) {
            await refreshOutline();
            const next = state.items.find(
              (it) => it.id !== state.currentId && it.state === "available",
            );
            if (next) {
              el("controls").innerHTML =
                '<button id="next">Next concept →</button>';
              el("next").addEventListener("click", () => openNode(next.id));
            } else {
              el("controls").innerHTML =
                '<p class="muted">You have completed the current outline.</p>';
            }
          } else if (data.remediation_html) {
            appendRemediation(data.remediation_html);
          }
        } catch (err) {
          el("result").innerHTML =
            '<p class="error">error: ' + escapeHtml(String(err)) + "</p>";
        }
      }

      // Append-only interaction layer (§4.3): each attempt's grades and each
      // remediation stay in the document, never overwritten within a node.
      function appendGrades(grades) {
        const div = document.createElement("div");
        div.className = "grades";
        div.innerHTML = (grades || [])
          .map(
            (g) =>
              '<div class="grade ' +
              g.grade +
              '"><strong>' +
              g.grade.replace("_", " ") +
              "</strong> — " +
              escapeHtml(g.feedback || "") +
              "</div>",
          )
          .join("");
        el("interactions").appendChild(div);
      }

      // Remediation (§8.2): a worked EXPLANATION of the missed problem (sanitized
      // prose) followed by a NEW practice problem that runs in its own SANDBOX
      // iframe — submittable and gradeable exactly like the node's check, with the
      // answer never revealed. Server-side that new problem becomes the node's
      // active rubric, so its submission (via postMessage → submitAnswer) grades
      // the new problem and either advances or remediates again.
      function appendRemediation(explanationHtml) {
        // Freeze earlier remediation problems so only the latest is answerable —
        // the log still reads as the full history (§4.3).
        document
          .querySelectorAll("#interactions .remediation .sandbox")
          .forEach((f) => {
            f.style.pointerEvents = "none";
            f.style.opacity = "0.55";
          });
        const wrap = document.createElement("div");
        wrap.className = "remediation";
        const head = document.createElement("div");
        head.innerHTML = "<h3>Let's review</h3>" + sanitizeHtml(explanationHtml);
        wrap.appendChild(head);
        // The server always regenerates a fresh exercise on a failed answer
        // (§8.2) — same node id, same frame URL, sidecar overwritten in place.
        const label = document.createElement("p");
        label.className = "muted";
        label.textContent = "Now try this one:";
        wrap.appendChild(label);
        wrap.appendChild(buildExerciseIframe(state.nodeId));
        el("interactions").appendChild(wrap);
      }

      // --- SSE parser over fetch (POST) -------------------------------------
      async function readSse(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buf.indexOf("\n\n")) !== -1) {
            const block = buf.slice(0, sep);
            buf = buf.slice(sep + 2);
            let event = "message";
            let data = "";
            for (const line of block.split("\n")) {
              if (line.startsWith("event:")) event = line.slice(6).trim();
              else if (line.startsWith("data:")) data += line.slice(5).trim();
            }
            if (data) onEvent(event, JSON.parse(data));
          }
        }
      }

      function escapeHtml(s) {
        return s.replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      // Sanitizes LLM-generated HTML before inserting it into the app origin
      // (§3.1, §4.4). Parsing happens in an inert <template> (images don't load,
      // scripts don't run), then we remove dangerous elements, event attributes
      // (on*) and non-http href/src URLs. Real interactive blocks don't go
      // through here — they run isolated in the sandbox iframe.
      //
      // The BLOCKED/attributes list below is the enforcement counterpart of
      // PROSE_HTML_CONTRACT in engine.rs, which tells the model the same limit.
      // Change one, change the other — otherwise the model generates something
      // that disappears here.
      function sanitizeHtml(html) {
        const tpl = document.createElement("template");
        tpl.innerHTML = html;
        const BLOCKED = new Set([
          "SCRIPT",
          "IFRAME",
          "OBJECT",
          "EMBED",
          "LINK",
          "META",
          "BASE",
          "STYLE",
          "FORM",
        ]);
        const SAFE_URI = /^(https?:|mailto:|#|\/|data:image\/)/i;
        const els = [];
        const walker = document.createTreeWalker(
          tpl.content,
          NodeFilter.SHOW_ELEMENT,
        );
        for (let n = walker.nextNode(); n; n = walker.nextNode()) els.push(n);
        for (const elm of els) {
          if (BLOCKED.has(elm.tagName)) {
            elm.remove();
            continue;
          }
          for (const attr of [...elm.attributes]) {
            const name = attr.name.toLowerCase();
            if (name.startsWith("on") || name === "srcdoc" || name === "style") {
              elm.removeAttribute(attr.name);
            } else if (
              (name === "href" || name === "src" || name === "xlink:href") &&
              !SAFE_URI.test(attr.value.trim())
            ) {
              elm.removeAttribute(attr.name);
            }
          }
        }
        return tpl.innerHTML;
      }
    </script>
  </body>
</html>
