[package]
name = "learnive"
version = "0.1.0"
edition = "2024"

[dependencies]
learnive-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hot-swap the AI provider when the user (re)configures it in /setup (§12).
arc-swap = "1"
# Source normalization (§11.1): acquired HTML → extracted text.
html2text = "0.17"
# Retrieval layer (§10): semantic embeddings (static, no onnxruntime) + chunking.
model2vec-rs = "0.2"
text-splitter = "0.32"
async-stream = "0.3"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
