[package]
name = "learnive"
version = "0.1.0"
edition = "2024"

[dependencies]
learnive-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
# `libgen-rs` was dropped — its search is a hash-scrape of `search.php` HTML
# that only matches one LibGen UI generation and returns nothing on the
# mirrors that answer today (libgen.li serves `index.php`). The LibGen backend
# now speaks the canonical `out=json` API directly, which covers both
# `search.php` (libgen.is/rs/st) and `index.php` (libgen.li/im).
serde_json = "1"
# Source acquisition (§11.1): HTML scraping of LibGen's search-results page to
# extract (title, author, md5) per book. LibGen mirrors don't expose a single
# stable JSON endpoint that carries both title and md5 across generations
# (libgen.li serves `index.php` results as HTML; libgen.is answers the
# `out=json` query), so we scrape the results table and keep a JSON fallback.
scraper = "0.20"
# Hot-swap the AI provider when the user (re)configures it in /setup (§12).
arc-swap = "1"
# Source normalization (§11.1): acquired HTML → extracted text.
html2text = "0.17"
# Source ingestion sanitization (§11.1/S19): whitelist acquired HTML once,
# at ingestion, before it's stored in the corpus or ever reaches a browser.
ammonia = "4"
# Retrieval layer (§10): semantic embeddings (static, no onnxruntime) + chunking.
model2vec-rs = "0.2"
text-splitter = "0.32"
async-stream = "0.3"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
lol_html = "3.0.1"
# Source acquisition (§11.1): PDF-backed backends (LibGen/Sci-Hub) extract
# text from the downloaded PDF into the normalized corpus representation.
pdf-extract = "0.12"
# Shared `url::Url` for building mirror/search/download URLs in the sources.
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
